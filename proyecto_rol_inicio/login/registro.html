<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - Sistema IX</title>
    <link rel="stylesheet" href="styles.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap"
        rel="stylesheet">
</head>

<body class="body-login">
    <div class="contenedor-auth">
        <header class="header-auth">
            <h1>Nueva Leyenda</h1>
            <p>Registra tu nombre en los archivos del sistema.</p>
        </header>

        <form id="form-registro" class="formulario-auth">
            <div class="campo-auth">
                <label for="nombre">Nombre de Jugador</label>
                <input type="text" id="nombre" required placeholder="Ej: Arathorn">
            </div>

            <div class="campo-auth">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" required placeholder="viajero@reino.com">
            </div>

            <div class="campo-auth">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="Mínimo 6 caracteres" minlength="6">
            </div>

            <button type="submit" class="btn btn-primario btn-auth">Crear Cuenta</button>
        </form>

        <footer class="footer-auth">
            <p>¿Ya tienes una cuenta? <a href="login.html">Regresar a la Taberna</a></p>
        </footer>
    </div>
    <!-- 1. Traemos la librería oficial de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- 2. Traemos tus llaves maestras (El archivo que creaste antes) -->
    <script src="supabase-config.js"></script>

    <!-- 3. Nuestro código para manejar el registro -->
    <script src="auth.js"></script>
</body>

</html>
