<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sistema IX</title>
    <link rel="stylesheet" href="styles.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Crimson+Text:ital,wght@0,400;0,600;1,400&display=swap"
        rel="stylesheet">
</head>

<body class="body-login">
    <div class="contenedor-auth">
        <header class="header-auth">
            <h1>Iniciar Sesión</h1>
            <p>El tomo se abre nuevamente para ti.</p>
        </header>

        <form id="form-login" class="formulario-auth">
            <div class="campo-auth">
                <label for="email">Correo Electrónico</label>
                <input type="email" id="email" required placeholder="viajero@reino.com">
            </div>

            <div class="campo-auth">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="Tu palabra secreta">
            </div>

            <button type="submit" class="btn btn-primario btn-auth">Entrar a la Taberna</button>
        </form>

        <div class="divisor-auth">
            <span>o</span>
        </div>

        <button id="btn-google" class="btn btn-secundario btn-auth btn-google">
            <!-- Icono SVG de Google simplificado -->
            <svg width="20" height="20" viewBox="0 0 24 24">
                <path fill="currentColor"
                    d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                <path fill="currentColor"
                    d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                <path fill="currentColor"
                    d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
                <path fill="currentColor"
                    d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
            </svg>
            Acceder con Google
        </button>

        <footer class="footer-auth">
            <p>¿Aún no tienes una cuenta? <a href="registro.html">Forjar leyenda aquí</a></p>
        </footer>
    </div>

    <!-- 1. La librería de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- 2. Tus credenciales -->
    <script src="supabase-config.js"></script>

    <!-- 3. Nuestro código -->
    <script src="auth.js"></script>

</body>

</html>
